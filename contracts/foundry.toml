[profile.default]
src = "."
out = "out"
libs = ["lib"]
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# forge install OpenZeppelin/openzeppelin-contracts foundry-rs/forge-std
